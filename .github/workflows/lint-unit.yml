name: Lint and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          ((${#shell_files[@]} > 0)) || { echo 'No shell files found' >&2; exit 1; }
          bash -n "${shell_files[@]}"

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          shellcheck --severity=warning "${shell_files[@]}"

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(find scripts tests -type f -name '*.py' -print | sort)
          ((${#python_files[@]} > 0)) || { echo 'No Python files found' >&2; exit 1; }
          python3 -m py_compile "${python_files[@]}"

      - name: Validate module metadata
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source module.conf
          test "$ABK_MODULE_ID" = 'abk_fido_key'
          test "$ABK_MODULE_REPO_URL" = 'https://github.com/fanziyun/ABK_FIDO_KEY_MODULE'
          test "$ABK_MODULE_SUPPORTED_STAGES" = 'after_patch,before_build'
          test "$ABK_MODULE_RECOMMENDED_STAGES" = 'after_patch,before_build'
          # Not test -x: upstream tracks setup.sh as 100644 and ABK chmod +x's it
          # before running, so the exec bit is not part of the contract.
          test -f setup.sh

      - name: Validate the 5.15 ECC include survives
        shell: bash
        run: |
          set -euo pipefail
          # 5.15 keeps the internal ECC header outside include/, so core.c has to
          # pick it by relative path. Losing either arm of the __has_include
          # breaks one of the two supported kernel lines.
          grep -q '__has_include(<crypto/internal/ecc.h>)' files/drivers/abk_fido_key/core.c
          grep -q '"../../crypto/ecc.h"' files/drivers/abk_fido_key/core.c

      - name: Check the installer tolerates a tree without KernelSU
        shell: bash
        run: |
          set -euo pipefail
          # ABK builds with kernelsu_variant=None have no rules.c. The sepolicy
          # step must warn and continue there, not abort the build. The pattern
          # avoids a literal '$' so shellcheck does not read it as an expansion.
          grep -q 'no KernelSU rules.c found' scripts/abk_fido_setup.sh
          ! grep -qE 'abk_require_file .*rules' scripts/abk_fido_setup.sh

      - name: Check for 5.15 declaration-after-statement regressions
        shell: bash
        run: |
          set -euo pipefail
          # 5.15 builds with -Wdeclaration-after-statement and ABK adds -Werror.
          # Surface the driver's own findings here so the failure names the
          # lines, not just the failing test.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from pathlib import Path
          from test_driver_style import find_declarations_after_statements

          driver = Path("files/drivers/abk_fido_key/core.c")
          findings = find_declarations_after_statements(driver.read_text(encoding="utf-8"))
          for line, code in findings:
              print(f"{driver}:{line}: {code.strip()}", file=sys.stderr)
          sys.exit(1 if findings else 0)
          PY

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
