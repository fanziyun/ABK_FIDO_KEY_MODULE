name: Lint and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          ((${#shell_files[@]} > 0)) || { echo 'No shell files found' >&2; exit 1; }
          bash -n "${shell_files[@]}"

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          shellcheck --severity=warning "${shell_files[@]}"

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(find scripts tests -type f -name '*.py' -print | sort)
          ((${#python_files[@]} > 0)) || { echo 'No Python files found' >&2; exit 1; }
          python3 -m py_compile "${python_files[@]}"

      - name: Validate module metadata
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source module.conf
          test "$ABK_MODULE_ID" = 'abk_fido_key'
          test "$ABK_MODULE_REPO_URL" = 'https://github.com/fanziyun/ABK_FIDO_KEY_MODULE'
          test "$ABK_MODULE_SUPPORTED_STAGES" = 'after_patch,before_build'
          test "$ABK_MODULE_RECOMMENDED_STAGES" = 'after_patch,before_build'
          test "$ABK_MODULE_KERNEL_LINES" = '5.15,6.1'
          test -x setup.sh

      - name: Validate the driver carries its ownership marker
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            files/drivers/abk_fido_key/Kconfig \
            files/drivers/abk_fido_key/Makefile \
            files/drivers/abk_fido_key/core.c \
            files/include/linux/abk_fido_key.h; do
            grep -q 'ABK_FIDO_KEY_V1' "$file" || { echo "missing marker: $file" >&2; exit 1; }
          done

      - name: Validate the installer kernel-line whitelist matches the driver
        shell: bash
        run: |
          set -euo pipefail
          # The ECC include in core.c is what makes both kernel lines work; if it
          # is dropped, the installer whitelist is lying.
          grep -q '__has_include(<crypto/internal/ecc.h>)' files/drivers/abk_fido_key/core.c
          grep -q '"../../crypto/ecc.h"' files/drivers/abk_fido_key/core.c
          grep -q 'SUPPORTED_KERNELS = {"5.15", "6.1"}' scripts/install.py

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
